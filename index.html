/* VOICE : console perso d'étudiant R&T, nette et motivante

   LAYOUT : barre latérale sur PC, barre d'onglets en bas sur iPhone ; une colonne de cartes */
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121a23;--panel2:#17212c;--line:#22303e;--ink:#dbe6ee;--mute:#8596a6;--acc:#00e5a0;--cy:#3ad7ff;--bad:#ff5c7a;--warn:#ffc24a;--mono:'JetBrains Mono',ui-monospace,monospace}

body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0f2a26 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:#0d131a;display:flex;flex-direction:column;gap:4px}
.brand{font:700 18px var(--mono);color:var(--acc);padding:0 10px 20px}.brand span{color:var(--mute)}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500;min-height:44px}
nav a svg{width:20px;height:20px;flex:none}
nav a:hover{background:var(--panel);color:var(--ink)}
nav a.on{background:var(--panel2);color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}
main{padding:clamp(20px,4vw,44px) max(4vw,16px) 110px;max-width:1100px;width:100%}
h1{font:700 clamp(26px,4vw,38px)/1.1 var(--mono);margin:0 0 6px;text-wrap:balance}
h1 b{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 26px}
h2{font:700 17px var(--mono);margin:0 0 14px;color:var(--ink)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.big{font:700 clamp(40px,7vw,64px)/1 var(--mono);color:var(--acc)}
.big small{font-size:18px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1}.row .m{color:var(--mute);font-size:14px}
.tag{font:500 12px var(--mono);padding:3px 8px;border-radius:6px;background:#0f2a26;color:var(--acc);white-space:nowrap}
.tag.ds{background:#3a1520;color:var(--bad)}.tag.cy{background:#0e2633;color:var(--cy)}
.time{font:700 15px var(--mono);color:var(--cy);white-space:nowrap;width:108px}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));margin-bottom:18px}
input,select,textarea,button{font:inherit;font-size:16px;min-height:44px;border-radius:10px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--acc);color:#04140f;border:0;font-weight:600;padding:0 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
button.x{background:transparent;color:var(--mute);min-height:36px;width:36px;padding:0;font-size:20px}
button.x:hover{color:var(--bad)}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.ok{color:var(--acc)}.ko{color:var(--bad)}
.done .t{text-decoration:line-through;color:var(--mute)}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--acc);flex:none}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.res{font:500 15px var(--mono);display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:12px}
.res dt{color:var(--mute)}.res dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:19px;cursor:pointer;background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:24px;margin-bottom:12px}
.flash.back{border-color:var(--acc);color:var(--acc)}
.modal{position:fixed;inset:0;background:#000c;display:none;flex-direction:column;z-index:50}
.modal.on{display:flex}
.modal header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.modal header b{flex:1;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages{overflow:auto;flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pages canvas{max-width:100%;height:auto!important;border-radius:6px;box-shadow:0 4px 30px #0008}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--ink);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.note{font-size:14px;color:var(--mute);border-left:2px solid var(--cy);padding-left:12px;margin:0 0 18px}
@media(max-width:760px){
.app{grid-template-columns:1fr}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40;justify-content:space-around;gap:0}
.brand{display:none}
nav a{flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;flex:1;justify-content:center}
nav a.on{box-shadow:inset 0 2px 0 var(--acc)}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="view"></main>
</div>
<div class="modal" id="modal"><header><b id="mtitle"></b><button class="ghost" id="mclose">Fermer</button></header><div class="pages" id="pages"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
{
/* ---------- Stockage (localStorage, avec repli en mémoire) ---------- */
const mem={};
const S={
  get(k,d){try{const v=localStorage.getItem('but_'+k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},
  set(k,v){mem[k]=v;try{localStorage.setItem('but_'+k,JSON.stringify(v))}catch(e){}}
};
/* ---------- IndexedDB pour les PDF (trop lourds pour localStorage) ---------- */
let dbP=null;
const db=()=>dbP||(dbP=new Promise((ok,ko)=>{try{const r=indexedDB.open('butdb',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdfs',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}}));
const tx=async(mode,fn)=>{const d=await db();return new Promise((ok,ko)=>{const t=d.transaction('pdfs',mode);const r=fn(t.objectStore('pdfs'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)})};
const memPdf=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)};
const UES={UE1:'UE1 · Administrer',UE2:'UE2 · Connecter',UE3:'UE3 · Programmer'};
const JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=s=>Math.round((new Date(s+'T00:00')-today())/864e5);
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

/* ---------- Navigation ---------- */
const ic={
 accueil:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 edt:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 notes:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 devoirs:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>',
 revisions:'<path d="M4 19V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h13"/>',
 reseau:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5M12 12l-6 5M12 12l6 5"/>'
};
const NAV=[['accueil','Accueil'],['edt','EDT'],['notes','Notes'],['devoirs','Devoirs'],['revisions','Révisions'],['reseau','Réseau']];
$('#nav').innerHTML='<div class="brand"><svg width="30" height="30" style="vertical-align:-8px;margin-right:8px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10302b"/><stop offset="1" stop-color="#0b0f14"/></linearGradient><linearGradient id="ln2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ad7ff"/><stop offset="1" stop-color="#00e5a0"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bg2)"/><rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#22303e" stroke-width="4"/><path d="M150 160 L290 256 L150 352" fill="none" stroke="url(#ln2)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="160" r="34" fill="#0b0f14" stroke="#3ad7ff" stroke-width="16"/><circle cx="290" cy="256" r="38" fill="#0b0f14" stroke="#00e5a0" stroke-width="18"/><circle cx="150" cy="352" r="34" fill="#0b0f14" stroke="#00e5a0" stroke-width="16"/><rect x="318" y="330" width="96" height="30" rx="15" fill="#00e5a0"/></svg>BUT<span>_R&amp;T</span></div>'+NAV.map(([k,l])=>`<a href="#${k}" data-k="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>${l}</a>`).join('');

/* ---------- Calculs de moyennes ---------- */
const avg=list=>{const c=list.reduce((a,n)=>a+ +n.coef,0);return c?list.reduce((a,n)=>a+n.note*n.coef,0)/c:null};
const ueAvgs=()=>{const notes=S.get('notes',[]);return Object.keys(UES).map(u=>({u,m:avg(notes.filter(n=>n.ue===u))}))};
const genAvg=()=>{const v=ueAvgs().filter(x=>x.m!==null);return v.length?v.reduce((a,x)=>a+x.m,0)/v.length:null};
const fx=n=>n===null?'—':n.toFixed(2).replace('.',',');

/* ---------- Vues ---------- */
const V={};
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const rowCours=c=>`<div class="row"><span class="time">${esc(c.debut)}–${esc(c.fin)}</span><span class="t">${esc(c.titre)}<div class="m">${esc([c.salle,c.prof].filter(Boolean).join(' · '))}</div></span><span class="tag ${c.type==='Info'?'':'cy'}">${esc(c.type||'—')}</span></div>`;
const API0='https://edt-but.myf-youssouf91.workers.dev';
let edtWeek='',loading=false;
const loadEdt=async(num='')=>{
  const api=S.get('apiUrl',API0);if(!api||loading)return;loading=true;if(location.hash==='#edt')render();
  try{const r=await fetch(api.replace(/\/+$/,'')+'/api/edt'+(num?'?semaine='+encodeURIComponent(num):''));const d=await r.json();if(!r.ok||d.erreur)throw new Error(d.erreur||r.status);
    const all=S.get('edtf',{});all[d.semaine]=d;S.set('edtf',all);if(!num)S.set('edtCur',d.semaine);edtWeek=d.semaine;toast('Emploi du temps à jour ✓')}
  catch(e){toast('Formadep injoignable : '+(e.message||e))}
  loading=false;render();
};
V.accueil=()=>{
  const d=new Date(),dj=d.getDay(),today=isoDay(d);
  const fm=Object.values(S.get('edtf',{})).flatMap(w=>w.cours).filter(c=>c.date===today);
  const edt=fm.length?fm:S.get('edt',[]).filter(c=>+c.jour===dj).sort((a,b)=>a.debut.localeCompare(b.debut));
  const dv=S.get('devoirs',[]);
  const ds=dv.filter(x=>x.type==='DS'&&!x.done&&daysTo(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const urg=dv.filter(x=>!x.done&&x.type!=='DS').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  const g=genAvg();
  return `<h1>Salut <b>Youssouf</b></h1><p class="sub">${JOURS[dj]} ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} · RT1-C1</p>
  <div class="grid">
   <div class="card"><h2>Prochain DS</h2>${ds?`<div class="big">J-${daysTo(ds.date)}</div><p style="margin:10px 0 0">${esc(ds.titre)} <span class="tag ds">${esc(ds.module)}</span></p><p class="m" style="color:var(--mute);margin:4px 0 0">${fmtD(ds.date)}</p>`:'<p class="empty">Aucun DS prévu. Ajoute-le dans Devoirs.</p>'}</div>
   <div class="card"><h2>Moyenne générale</h2><div class="big ${g!==null&&g<10?'ko':''}">${fx(g)}<small> /20</small></div>${ueAvgs().map(x=>`<div class="row"><span class="t">${UES[x.u]}</span><b class="${x.m===null?'':x.m>=10?'ok':'ko'}" style="font-family:var(--mono)">${fx(x.m)}</b></div>`).join('')}</div>
   <div class="card"><h2>Cours du jour</h2>${edt.length?edt.map(c=>rowCours({...c,titre:c.titre||c.module})).join(''):'<p class="empty">Pas de cours aujourd\'hui.</p>'}</div>
   <div class="card"><h2>À rendre</h2>${urg.length?urg.map(x=>`<div class="row"><span class="t">${esc(x.titre)}<div class="m">${esc(x.module)} · ${fmtD(x.date)}</div></span><span class="tag ${daysTo(x.date)<=2?'ds':''}">J-${daysTo(x.date)}</span></div>`).join(''):'<p class="empty">Rien à rendre. Profite 😎</p>'}</div>
  </div>`;
};
V.edt=()=>{
  const edt=S.get('edt',[]),api=S.get('apiUrl',API0),all=S.get('edtf',{});
  const wk=edtWeek||S.get('edtCur','')||Object.keys(all)[0],d=all[wk];
  const fmd=!api?`<div class="card" style="margin-bottom:16px"><h2>Connecter Formadep</h2><p class="m" style="color:var(--mute);margin:0 0 12px">Colle l'adresse de ton Worker Cloudflare (ex : https://edt-but.toncompte.workers.dev)</p><form class="f" data-f="api" style="grid-template-columns:1fr auto"><input name="url" type="url" placeholder="https://…workers.dev" required><button>Connecter</button></form></div>`
  :`<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><h2 style="margin:0;flex:1">Formadep · RT1C1</h2>
   ${d?`<select data-wk style="width:auto">${d.semaines.map(s=>`<option value="${esc(s.num)}" ${s.num===wk?'selected':''}>Semaine ${esc(s.num)} · ${fmtD(s.lundi)}</option>`).join('')}</select>`:''}
   <button class="ghost" data-sync>${loading?'Chargement…':'Actualiser'}</button><button class="x" data-unapi aria-label="Déconnecter">×</button></div>
   ${d?[...new Set(d.cours.map(c=>c.date))].map(dt=>`<h2 style="margin-top:16px">${fmtD(dt)}</h2>`+d.cours.filter(c=>c.date===dt).map(rowCours).join('')).join('')||'<p class="empty">Aucun cours cette semaine.</p>':'<p class="empty">Appuie sur Actualiser pour charger ta semaine.</p>'}
   ${d?`<p class="m" style="color:var(--mute);font-size:13px;margin:12px 0 0">Mis à jour ${new Date(d.maj).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</p>`:''}</div>`;
  return `<h1>Emploi du <b>temps</b></h1><p class="sub">Synchronisé avec Formadep</p>${fmd}
  <details class="card"><summary style="cursor:pointer;font-family:var(--mono);font-weight:700">Cours ajoutés à la main</summary><div style="margin-top:14px"><form class="f" data-f="edt">
   <select name="jour">${[1,2,3,4,5,6].map(j=>`<option value="${j}">${JOURS[j]}</option>`).join('')}</select>
   <input name="debut" type="time" value="08:30" required><input name="fin" type="time" value="10:00" required>
   <input name="module" placeholder="Module (ex : R1.06)" required><input name="salle" placeholder="Salle">
   <select name="type"><option>CM</option><option>TD</option><option>TP</option><option>SAÉ</option></select>
   <button>Ajouter</button></form>
  ${[1,2,3,4,5,6].map(j=>{const l=edt.filter(c=>+c.jour===j).sort((a,b)=>a.debut.localeCompare(b.debut));return l.length?`<h2 style="margin-top:18px">${JOURS[j]}</h2>`+l.map(c=>`<div class="row"><span class="time">${esc(c.debut)}–${esc(c.fin)}</span><span class="t">${esc(c.module)}<div class="m">${esc(c.salle)}</div></span><span class="tag cy">${esc(c.type)}</span><button class="x" data-del="edt" data-id="${esc(c.id)}" aria-label="Supprimer">×</button></div>`).join(''):''}).join('')||'<p class="empty">Aucun cours pour l\'instant.</p>'}</div></details>`;
};
V.notes=()=>{
  const notes=S.get('notes',[]);
  return `<h1>Notes & <b>moyennes</b></h1><p class="sub">Une UE est validée à partir de 10/20</p>
  <div class="card" style="margin-bottom:16px"><form class="f" data-f="notes">
   <input name="module" placeholder="Ressource / SAÉ (ex : R1.14)" required>
   <select name="ue">${Object.entries(UES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
   <input name="note" type="number" step="0.25" min="0" max="20" placeholder="Note /20" required>
   <input name="coef" type="number" step="0.5" min="0.5" placeholder="Coef" required>
   <button>Ajouter</button></form></div>
  <div class="grid">${Object.entries(UES).map(([u,l])=>{const ls=notes.filter(n=>n.ue===u),m=avg(ls);return `<div class="card"><h2>${l}</h2><div class="big ${m!==null&&m<10?'ko':''}" style="font-size:40px">${fx(m)}<small> /20</small></div><div class="bar"><i style="width:${m===null?0:m*5}%;background:${m!==null&&m<10?'var(--bad)':'var(--acc)'}"></i></div><div style="margin-top:12px">${ls.map(n=>`<div class="row"><span class="t">${esc(n.module)}<div class="m">coef ${esc(n.coef)}</div></span><b style="font-family:var(--mono)">${esc(n.note)}</b><button class="x" data-del="notes" data-id="${esc(n.id)}" aria-label="Supprimer">×</button></div>`).join('')||'<p class="empty">Aucune note.</p>'}</div></div>`}).join('')}</div>
  <div class="card" style="margin-top:16px"><h2>Simulateur</h2><p class="m" style="color:var(--mute);margin:0 0 12px">Quelle note il te faut à la prochaine évaluation pour atteindre ton objectif ?</p>
   <form class="f" data-f="sim"><select name="ue">${Object.entries(UES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input name="coef" type="number" step="0.5" min="0.5" placeholder="Coef de l'éval" required><input name="obj" type="number" step="0.5" min="0" max="20" value="10" placeholder="Objectif"><button>Calculer</button></form><div id="simres"></div></div>`;
};
V.devoirs=()=>{
  const dv=S.get('devoirs',[]).slice().sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date));
  return `<h1>Devoirs & <b>DS</b></h1><p class="sub">Triés par urgence</p>
  <div class="card"><form class="f" data-f="devoirs">
   <input name="titre" placeholder="Intitulé (ex : Compte rendu TP3)" required><input name="module" placeholder="Module" required>
   <select name="type"><option>Devoir</option><option>DS</option><option>Projet</option></select>
   <input name="date" type="date" required><button>Ajouter</button></form>
   ${dv.map(x=>{const j=daysTo(x.date);return `<div class="row ${x.done?'done':''}"><input type="checkbox" data-tog="${esc(x.id)}" ${x.done?'checked':''} aria-label="Fait"><span class="t">${esc(x.titre)}<div class="m">${esc(x.module)} · ${fmtD(x.date)}</div></span><span class="tag ${x.type==='DS'?'ds':''}">${esc(x.type)}</span><span class="tag ${!x.done&&j<=2?'ds':'cy'}">${j<0?'passé':'J-'+j}</span><button class="x" data-del="devoirs" data-id="${esc(x.id)}" aria-label="Supprimer">×</button></div>`}).join('')||'<p class="empty">Rien pour l\'instant.</p>'}</div>`;
};
let revTab='pdf',fcIdx=0,fcBack=false,fcMod='';
V.revisions=()=>{
  const cards=S.get('cards',[]),mods=[...new Set(cards.map(c=>c.module))];
  const deck=cards.filter(c=>!fcMod||c.module===fcMod);if(fcIdx>=deck.length)fcIdx=0;const cur=deck[fcIdx];
  return `<h1><b>Révisions</b></h1><p class="sub">Tes guides et tes flashcards</p>
  <div class="tabs"><button class="${revTab==='pdf'?'':'ghost'}" data-rt="pdf">Guides PDF</button><button class="${revTab==='fc'?'':'ghost'}" data-rt="fc">Flashcards</button></div>
  ${revTab==='pdf'?`<div class="card"><form class="f" data-f="pdf"><input name="module" placeholder="Module (ex : R1.06)" required><input name="file" type="file" accept="application/pdf" required><button>Déposer</button></form><div id="pdflist"><p class="empty">Chargement…</p></div></div>`
  :`<div class="grid"><div class="card"><h2>S'entraîner</h2><select data-fm style="margin-bottom:12px"><option value="">Tous les modules</option>${mods.map(m=>`<option ${m===fcMod?'selected':''}>${esc(m)}</option>`).join('')}</select>
   ${cur?`<div class="flash ${fcBack?'back':''}" data-flip>${esc(fcBack?cur.r:cur.q)}</div><div style="display:flex;gap:8px;align-items:center"><button class="ghost" data-fn="-1">←</button><span style="flex:1;text-align:center;color:var(--mute);font-family:var(--mono)">${fcIdx+1}/${deck.length}</span><button class="ghost" data-fn="1">→</button></div><p class="m" style="color:var(--mute);text-align:center;margin:8px 0 0">Touche la carte pour voir la réponse</p>`:'<p class="empty">Crée ta première carte.</p>'}</div>
   <div class="card"><h2>Nouvelle carte</h2><form class="f" data-f="cards" style="grid-template-columns:1fr"><input name="module" placeholder="Module" required><textarea name="q" rows="2" placeholder="Question" required></textarea><textarea name="r" rows="2" placeholder="Réponse" required></textarea><button>Ajouter la carte</button></form>
   ${cards.slice(-5).reverse().map(c=>`<div class="row"><span class="t">${esc(c.q)}<div class="m">${esc(c.module)}</div></span><button class="x" data-del="cards" data-id="${esc(c.id)}" aria-label="Supprimer">×</button></div>`).join('')}</div></div>`}`;
};
V.reseau=()=>`<h1>Outils <b>réseau</b></h1><p class="sub">Calcul IP et conversions</p>
  <div class="grid"><div class="card"><h2>Calculateur IP</h2><form class="f" data-f="ip" style="grid-template-columns:1fr auto"><input name="ip" value="192.168.1.10/24" placeholder="ex : 10.0.5.20/22" required><button>Calculer</button></form><div id="ipres"></div></div>
  <div class="card"><h2>Conversions</h2><form class="f" data-f="conv"><input name="v" value="200" required><select name="b"><option value="10">Décimal</option><option value="2">Binaire</option><option value="16">Hexa</option></select><button>Convertir</button></form><div id="convres"></div></div></div>`;

/* ---------- Rendu + routage ---------- */
const render=()=>{
  let k=location.hash.slice(1);if(!V[k])k='accueil';
  $('#view').innerHTML=V[k]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  if(k==='revisions'&&revTab==='pdf')listPdf();
  if(k==='reseau'){calcIp('192.168.1.10/24');conv('200',10)}
};
addEventListener('hashchange',render);

/* ---------- Outils réseau ---------- */
const ipToInt=s=>{const p=s.split('.');if(p.length!==4||p.some(x=>!/^\d+$/.test(x)||+x>255))return null;return p.reduce((a,x)=>a*256+ +x,0)};
const intToIp=n=>[24,16,8,0].map(s=>Math.floor(n/2**s)%256).join('.');
const bin=n=>[24,16,8,0].map(s=>(Math.floor(n/2**s)%256).toString(2).padStart(8,'0')).join('.');
const calcIp=v=>{
  const out=$('#ipres');const [a,c]=v.trim().split('/');const ip=ipToInt(a||''),cidr=+c;
  if(ip===null||!/^\d+$/.test(c||'')||cidr>32){out.innerHTML='<p class="ko">Format attendu : 192.168.1.10/24</p>';return}
  const size=2**(32-cidr),net=Math.floor(ip/size)*size,bc=net+size-1,mask=2**32-size;
  const hosts=cidr>=31?(cidr===32?1:2):size-2;
  const cls=+a.split('.')[0]<128?'A':+a.split('.')[0]<192?'B':+a.split('.')[0]<224?'C':'D/E';
  out.innerHTML=`<dl class="res"><dt>Masque</dt><dd>${intToIp(mask)}</dd><dt>Réseau</dt><dd class="ok">${intToIp(net)}/${cidr}</dd><dt>Broadcast</dt><dd>${intToIp(bc)}</dd><dt>1re hôte</dt><dd>${cidr>=31?intToIp(net):intToIp(net+1)}</dd><dt>Dernière</dt><dd>${cidr>=31?intToIp(bc):intToIp(bc-1)}</dd><dt>Nb hôtes</dt><dd>${hosts.toLocaleString('fr-FR')}</dd><dt>Classe</dt><dd>${cls}</dd><dt>IP bin</dt><dd>${bin(ip)}</dd><dt>Masque bin</dt><dd>${bin(mask)}</dd></dl>`;
};
const conv=(v,b)=>{
  const out=$('#convres');const ok={2:/^[01]+$/,10:/^\d+$/,16:/^[0-9a-f]+$/i}[b].test(v.trim());const n=ok?parseInt(v.trim(),b):NaN;
  out.innerHTML=isNaN(n)?'<p class="ko">Valeur invalide pour cette base</p>':`<dl class="res"><dt>Décimal</dt><dd>${n}</dd><dt>Binaire</dt><dd class="ok">${n.toString(2).replace(/\B(?=(\d{4})+$)/g,' ')}</dd><dt>Hexa</dt><dd>0x${n.toString(16).toUpperCase()}</dd></dl>`;
};

/* ---------- PDF ---------- */
const listPdf=async()=>{
  let l;try{l=await tx('readonly',s=>s.getAll())}catch(e){l=memPdf}
  const el=$('#pdflist');if(!el)return;
  const mods=[...new Set(l.map(p=>p.module))].sort();
  el.innerHTML=mods.map(m=>`<h2 style="margin-top:14px">${esc(m)}</h2>`+l.filter(p=>p.module===m).map(p=>`<div class="row"><span class="t">${esc(p.name)}<div class="m">${(p.size/1048576).toFixed(1).replace('.',',')} Mo</div></span><button class="ghost" data-open="${esc(p.id)}">Ouvrir</button><button class="x" data-dpdf="${esc(p.id)}" aria-label="Supprimer">×</button></div>`).join('')).join('')||'<p class="empty">Dépose ton premier guide.</p>';
};
const openPdf=async id=>{
  let p;try{p=await tx('readonly',s=>s.get(id))}catch(e){p=memPdf.find(x=>x.id===id)}
  if(!p)return;$('#mtitle').textContent=p.name;const box=$('#pages');box.innerHTML='<p class="empty">Ouverture…</p>';$('#modal').classList.add('on');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await p.blob.arrayBuffer()}).promise;box.innerHTML='';
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),vp=pg.getViewport({scale:1.6}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;box.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}
  }catch(e){box.innerHTML='<p class="ko">Impossible d\'afficher ce PDF ici.</p>'}
};
$('#mclose').onclick=()=>{$('#modal').classList.remove('on');$('#pages').innerHTML=''};

/* ---------- Événements ---------- */
document.addEventListener('submit',async e=>{
  const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));
  if(k==='api'){S.set('apiUrl',d.url.trim());return loadEdt()}
  if(k==='ip')return calcIp(d.ip);
  if(k==='conv')return conv(d.v,+d.b);
  if(k==='sim'){const ls=S.get('notes',[]).filter(n=>n.ue===d.ue),sc=ls.reduce((a,n)=>a+ +n.coef,0),sn=ls.reduce((a,n)=>a+n.note*n.coef,0),c=+d.coef,o=+d.obj||10,need=(o*(sc+c)-sn)/c;
    $('#simres').innerHTML=`<div class="big" style="font-size:44px;margin-top:6px">${need<=0?'0':need>20?'&gt;20':fx(need)}<small> /20</small></div><p style="margin:6px 0 0" class="${need>20?'ko':'ok'}">${need<=0?'Objectif déjà atteint, même avec 0 💪':need>20?'Pas atteignable sur cette seule éval, il faudra rattraper ailleurs.':'Note minimale pour atteindre '+o+'/20 dans cette UE.'}</p>`;return}
  if(k==='pdf'){const file=f.file.files[0];if(!file)return;const p={id:uid(),module:d.module.trim(),name:file.name,size:file.size,blob:file};
    try{await tx('readwrite',s=>s.put(p))}catch(err){memPdf.push(p)}toast('Guide déposé ✓');f.reset();return listPdf()}
  if(k==='notes'){d.note=+d.note;d.coef=+d.coef}
  d.id=uid();const l=S.get(k,[]);l.push(d);S.set(k,l);toast('Ajouté ✓');render();
});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-flip],input[type=checkbox]');if(!t)return;
  if(t.dataset.sync!==undefined)return loadEdt(edtWeek);
  if(t.dataset.unapi!==undefined){S.set('apiUrl','');return render()}
  if(t.dataset.del){const k=t.dataset.del;S.set(k,S.get(k,[]).filter(x=>x.id!==t.dataset.id));toast('Supprimé');return render()}
  if(t.dataset.tog){S.set('devoirs',S.get('devoirs',[]).map(x=>x.id===t.dataset.tog?{...x,done:!x.done}:x));return render()}
  if(t.dataset.rt){revTab=t.dataset.rt;return render()}
  if(t.dataset.flip!==undefined){fcBack=!fcBack;return render()}
  if(t.dataset.fn){const n=S.get('cards',[]).filter(c=>!fcMod||c.module===fcMod).length;fcIdx=(fcIdx+ +t.dataset.fn+n)%n;fcBack=false;return render()}
  if(t.dataset.open)return openPdf(t.dataset.open);
  if(t.dataset.dpdf){const id=t.dataset.dpdf;try{await tx('readwrite',s=>s.delete(id))}catch(err){memPdf.splice(memPdf.findIndex(x=>x.id===id),1)}toast('Supprimé');return listPdf()}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-fm]')){fcMod=e.target.value;fcIdx=0;fcBack=false;render()}
  if(e.target.matches('[data-wk]')){edtWeek=e.target.value;S.get('edtf',{})[edtWeek]?render():loadEdt(edtWeek)}
});
render();
/* Au démarrage : on rafraîchit la semaine en cours si les données ont plus de 6 h */
{const cur=S.get('edtf',{})[S.get('edtCur','')];if(S.get('apiUrl',API0)&&(!cur||Date.now()-new Date(cur.maj)>6*36e5))loadEdt()}
}
</script>
</body>
</html>
