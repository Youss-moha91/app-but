<style>
/* VOICE : console perso d'étudiant R&T, nette et motivante
   IDEA : un terminal de supervision réseau, chaque section est un "module" du système
   PICTURE : l'outil lui-même (cartes de données vivantes, compte à rebours en grand)
   COLOUR and TYPE : nuit #0b0f14, panneaux #121a23, accent vert terminal #00e5a0, cyan #3ad7ff, alerte #ff5c7a ; JetBrains Mono pour titres/chiffres, Inter pour le texte
   LAYOUT : barre latérale sur PC, barre d'onglets en bas sur iPhone ; une colonne de cartes */
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121a23;--panel2:#17212c;--line:#22303e;--ink:#dbe6ee;--mute:#8596a6;--acc:#00e5a0;--cy:#3ad7ff;--bad:#ff5c7a;--warn:#ffc24a;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0f2a26 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:#0d131a;display:flex;flex-direction:column;gap:4px}
.brand{font:700 18px var(--mono);color:var(--acc);padding:0 10px 20px}.brand span{color:var(--mute)}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500;min-height:44px}
nav a svg{width:20px;height:20px;flex:none}
nav a:hover{background:var(--panel);color:var(--ink)}
nav a.on{background:var(--panel2);color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}
main{padding:calc(clamp(20px,4vw,44px) + env(safe-area-inset-top)) max(4vw,16px) 110px;max-width:1100px;width:100%}
h1{font:700 clamp(26px,4vw,38px)/1.1 var(--mono);margin:0 0 6px;text-wrap:balance}
h1 b{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 26px}
h2{font:700 17px var(--mono);margin:0 0 14px;color:var(--ink)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.big{font:700 clamp(40px,7vw,64px)/1 var(--mono);color:var(--acc)}
.big small{font-size:18px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1}.row .m{color:var(--mute);font-size:14px}
.tag{font:500 12px var(--mono);padding:3px 8px;border-radius:6px;background:#0f2a26;color:var(--acc);white-space:nowrap}
.tag.ds{background:#3a1520;color:var(--bad)}.tag.cy{background:#0e2633;color:var(--cy)}
.time{font:700 15px var(--mono);color:var(--cy);white-space:nowrap;width:108px}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));margin-bottom:18px}
input,select,textarea,button{font:inherit;font-size:16px;min-height:44px;border-radius:10px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--acc);color:#04140f;border:0;font-weight:600;padding:0 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
button.x{background:transparent;color:var(--mute);min-height:36px;width:36px;padding:0;font-size:20px}
button.x:hover{color:var(--bad)}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.ok{color:var(--acc)}.ko{color:var(--bad)}
.done .t{text-decoration:line-through;color:var(--mute)}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--acc);flex:none}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.res{font:500 15px var(--mono);display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:12px}
.res dt{color:var(--mute)}.res dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:19px;cursor:pointer;background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:24px;margin-bottom:12px}

.modal.on{display:flex}

.modal header b{flex:1;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages{overflow:auto;flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pages canvas{max-width:100%;height:auto!important;border-radius:6px;box-shadow:0 4px 30px #0008}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--ink);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.tbl{width:100%;border-collapse:collapse;font:14px/1.4 var(--mono)}.tbl th{text-align:left;color:var(--mute);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td.d{font-family:Inter,sans-serif;white-space:normal;min-width:200px;color:var(--mute)}.tbl .r{text-align:right}
.cmd{font:500 14px var(--mono);color:var(--acc);background:var(--bg);padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:4px;overflow-wrap:anywhere}
code{font-family:var(--mono);color:var(--cy)}
.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.tabs button{flex:none}
.tl{display:grid;position:relative}
.tl-head{margin-bottom:6px}.tl-head span{text-align:center;font:600 12px var(--mono);color:var(--mute);text-transform:capitalize}.tl-head span.ok{color:var(--acc)}
.tl-h{position:relative}.tl-h span{position:absolute;right:8px;transform:translateY(-50%);font:500 12px var(--mono);color:var(--mute)}
.tl-d{position:relative;border-left:1px solid var(--line)}.tl-d i{position:absolute;left:0;right:0;border-top:1px dashed #1c2935}
.blk{position:absolute;margin-left:3px;border-radius:9px;padding:5px 8px;background:var(--panel2);background:color-mix(in srgb,var(--c) 17%,var(--panel));border-left:4px solid var(--c);overflow:hidden;font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:1px;z-index:2}
.blk b{font-weight:600;color:var(--ink);overflow-wrap:anywhere}.blk small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk em{font:600 11px var(--mono);font-style:normal;color:var(--c);position:absolute;top:5px;right:8px}.blk b{padding-right:34px}
.edtbar button{padding:0 13px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}.now::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.strip{display:flex;gap:6px;align-items:stretch;margin-bottom:14px}
.dy{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;min-height:64px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:12px;font-weight:500;text-transform:capitalize;position:relative}
.dy b{font:700 19px var(--mono);color:var(--ink)}.dy.today{border-color:var(--acc)}.dy.on{background:var(--acc);border-color:var(--acc);color:#04140f}.dy.on b{color:#04140f}
.dy i{width:5px;height:5px;border-radius:50%;background:var(--cy);position:absolute;bottom:6px}.dy.on i{background:#04140f}
.arr{min-width:34px;padding:0;font-size:22px}
.tl-card{padding:16px 14px 16px 8px}
.offline{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:45;font:600 12px var(--mono);background:#3a1520;color:var(--bad);border:1px solid var(--bad);padding:5px 10px;border-radius:20px;display:none}.offline.on{display:block}
.undo{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 6px 6px 16px;border-radius:12px;display:none;align-items:center;gap:14px;z-index:61;box-shadow:0 8px 30px #000a}.undo.on{display:flex}.undo button{min-height:38px;padding:0 14px}
.sheet-bg{position:fixed;inset:0;background:#000b;display:none;z-index:55;align-items:flex-end;justify-content:center}.sheet-bg.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c,var(--acc));border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{font:700 22px/1.2 var(--mono);margin:6px 0 4px}.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
@media(min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.live{border-left:4px solid var(--c,var(--acc));cursor:pointer}.live .when{font:700 clamp(30px,6vw,44px)/1.05 var(--mono);color:var(--c,var(--acc));margin:4px 0 8px}
.row.cur{background:#0f2a26;border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px;box-shadow:inset 3px 0 0 var(--acc)}
[data-cday]{cursor:pointer}
.lg{display:inline-block;font:700 12px var(--mono);padding:3px 8px;border-radius:6px;margin:0 4px 4px 0;white-space:nowrap}
.pars{font:700 clamp(30px,6vw,40px)/1.1 var(--mono);color:var(--acc);margin:4px 0 10px}
.alerte{margin-top:10px;padding:10px 12px;border-radius:10px;background:#3a1520;color:#ffb3c0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.tile span{font-size:12px;color:var(--mute)}.tile b{font:700 22px var(--mono)}
a.hint{display:block;text-decoration:none;color:var(--mute);font-size:15px}a.hint b{color:var(--acc)}
.seg{margin-bottom:18px}
.chips{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.chips button{min-height:30px;padding:0 10px;font-size:13px;background:transparent;color:var(--mute);border-radius:7px}
.chips button.on{background:var(--acc);color:#04140f}
.voie{display:inline-block;font:700 12px var(--mono);padding:2px 7px;border-radius:6px;margin:0 8px 4px -2px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap}
.note{font-size:14px;color:var(--mute);border-left:2px solid var(--cy);padding-left:12px;margin:0 0 18px}
@media(max-width:760px){
.app{grid-template-columns:1fr}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:8px 4px calc(10px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40;justify-content:space-around;gap:0}
.brand{display:none}
nav a{flex-direction:column;gap:4px;font-size:12.5px;padding:8px 2px;flex:1;justify-content:center;min-height:62px}
nav a svg{width:26px;height:26px}
main{padding-bottom:130px}
nav a.on{box-shadow:inset 0 2px 0 var(--acc)}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="view"></main>
</div>
<div class="modal" id="modal"><header><b id="mtitle"></b><button class="ghost" id="mclose">Fermer</button></header><div class="pages" id="pages"></div></div>
<div class="toast" id="toast"></div>
<div class="undo" id="undo"><span id="undomsg"></span><button data-undo>Annuler</button></div>
<div class="sheet-bg" id="sheet"><div class="sheet" id="sheetc"></div></div>
<div class="offline" id="offline">● Hors ligne</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
{
/* ---------- Stockage (localStorage, avec repli en mémoire) ---------- */
const mem={};
const S={
  get(k,d){try{const v=localStorage.getItem('but_'+k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},
  raw(k,v){mem[k]=v;try{v===null?localStorage.removeItem('but_'+k):localStorage.setItem('but_'+k,JSON.stringify(v))}catch(e){}},
  // set = raw + on note l'heure de modification pour la synchro
  set(k,v){S.raw(k,v);if(SYNC_KEYS.includes(k)){S.raw('_mod',Date.now());schedulePush()}}
};
/* ---------- IndexedDB pour les PDF (trop lourds pour localStorage) ---------- */
let dbP=null;
const db=()=>dbP||(dbP=new Promise((ok,ko)=>{try{const r=indexedDB.open('butdb',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdfs',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}}));
const tx=async(mode,fn)=>{const d=await db();return new Promise((ok,ko)=>{const t=d.transaction('pdfs',mode);const r=fn(t.objectStore('pdfs'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)})};
const memPdf=[];
/* ---------- Supabase : connexion par code + synchronisation ---------- */
const SB_URL='https://umxwydryeeibdumnfnvh.supabase.co';
const SB_KEY='sb_publishable_81edgFxLrWV2yQ_SThCaCg_UN5TNYe7';
const SYNC_KEYS=['notes','devoirs','edt','cards','abs','absSeuil','pdfmeta','notifPrefs','trajet','profil']; // ce qui part dans le cloud
let sb=null,sbUser=null,syncMsg='',otpEmail='',pushT=null,syncing=false;
const localDoc=()=>{const o={};for(const k of SYNC_KEYS){const v=S.get(k,null);if(v!==null)o[k]=v}return o};
const schedulePush=()=>{if(!sbUser)return;clearTimeout(pushT);pushT=setTimeout(syncNow,1500)};
// Règle simple : la version la plus récente gagne (dernière modification locale vs cloud)
const syncNow=async()=>{
  if(!sb||!sbUser||syncing)return;if(navigator.onLine===false){syncMsg='Hors ligne · synchro au retour du réseau';return}syncing=true;
  try{
    const {data,error}=await sb.from('user_data').select('data,updated_at').eq('user_id',sbUser.id).maybeSingle();
    if(error)throw error;
    const remoteT=data?Date.parse(data.updated_at):0,localT=+S.get('_mod',0);
    if(data&&remoteT>localT){
      for(const k of SYNC_KEYS)S.raw(k,data.data[k]??null);
      S.raw('_mod',remoteT);syncMsg='Données récupérées du cloud';
    }else if(!data||localT>remoteT){
      const t=localT||Date.now();S.raw('_mod',t);
      const {error:e2}=await sb.from('user_data').upsert({user_id:sbUser.id,data:localDoc(),updated_at:new Date(t).toISOString()});
      if(e2)throw e2;syncMsg='Envoyé vers le cloud';
    }else syncMsg='Déjà à jour';
    S.raw('_sync',Date.now());
    await uploadPendingPdfs();
  }catch(e){syncMsg='Erreur : '+(e.message||e)}
  syncing=false;render();
};
const sbInit=async()=>{
  if(!window.supabase||SB_URL.startsWith('__'))return;
  try{
    sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const {data:{session}}=await sb.auth.getSession();sbUser=session?.user||null;
    sb.auth.onAuthStateChange((_e,s)=>{sbUser=s?.user||null});
    if(sbUser)syncNow();else render();
  }catch(e){sb=null}
};
// Quand tu reviens sur l'app (changement d'appareil, d'onglet…), on resynchronise
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});

// Connexion par e-mail + mot de passe (aucun e-mail envoyé : "Confirm email" est désactivé dans Supabase)
const login=async(email,password,create)=>{
  const {data,error}=create?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(error){toast(/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect':'Erreur : '+error.message);return}
  if(!data.session){toast('Compte créé, mais Supabase demande une confirmation par e-mail : désactive « Confirm email »');return}
  sbUser=data.user;toast(create?'Compte créé ✓':'Connecté ✓');syncNow();
};
const syncCard=()=>{
  if(!sb)return `<div class="card"><h2>Synchronisation</h2><p class="empty">${SB_URL.startsWith('__')?'Supabase pas encore configuré.':'Synchronisation indisponible ici (ouvre l\'app depuis ton site GitHub).'}</p></div>`;
  if(!sbUser)return `<div class="card"><h2>Synchronisation ☁</h2><p class="m" style="color:var(--mute);margin:0 0 12px">Connecte-toi pour retrouver tes notes, devoirs et guides sur iPhone et PC.</p>
    <form class="f" data-f="login"><input name="email" type="email" autocomplete="email" placeholder="ton@email.fr" required><input name="pw" type="password" autocomplete="current-password" minlength="8" placeholder="Mot de passe (8 caractères min.)" required><button name="act" value="in">Se connecter</button><button name="act" value="up" class="ghost">Créer mon compte</button></form>
    <p class="m" style="color:var(--mute);font-size:13px;margin:4px 0 0">Première fois : « Créer mon compte ». Ensuite : « Se connecter ».</p></div>`;
  const last=S.get('_sync',0);

// Moyenne d'une matière : moyenne pondérée de ses évals
const modAvg=code=>{const l=notesList().filter(n=>n.mod===code),p=l.reduce((a,n)=>a+ +n.poids,0);return p?l.reduce((a,n)=>a+n.note*n.poids,0)/p:null};

const ueAvg=(u,skip)=>{let s=0,c=0;for(const [code,,,co] of MODS){if(!co[u]||code===skip)continue;const m=modAvg(code);if(m===null)continue;s+=m*co[u];c+=co[u]}return {m:c?s/c:null,c,s}};

const loadTrajet=async()=>{
  const el=$('#trajetbody'),t=trajetCfg();if(!el||!t)return;
  const mode=modeTrajet(),n=new Date(),today=isoDay(n),nm=n.getHours()*60+n.getMinutes();
  try{
    if(mode==='aller'){
      const cb=cibleTrajet();if(!cb){el.innerHTML='<p class="empty">Aucun cours à venir cette semaine.</p>';return}
      const d=await fetchTrajet(urlTrajet('arrivee',cb.day,hm(toMin(cb.c.debut)-(+t.marge||10)))),j=d.trajets[0];
      const quand=cb.day===today?"aujourd'hui":cb.day===addD(today,1)?'demain':fmtD(cb.day);
      el.innerHTML=j?`<p class="m" style="color:var(--mute);margin:8px 0 0">Pour ${esc(cb.c.code||cb.c.titre)} à ${esc(cb.c.debut.replace(':','h'))} ${quand}</p><div class="pars">Pars à ${esc(j.depart.replace(':','h'))}</div>${ligneCompacte(j)}${alertesHtml(d)}`:`<p class="empty">Aucun trajet trouvé pour arriver à l'heure.</p>${alertesHtml(d)}`;
    }else if(mode==='retour'){
      const l=coursDu(today);
      if(!l.length){el.innerHTML='<p class="empty">Pas de cours aujourd\'hui : rien à rentrer 😄 Utilise « Maintenant » si besoin.</p>';return}
      const fin=toMin(l[l.length-1].fin),h=Math.max(nm,fin+5);     // 5 min pour sortir du bâtiment
      const d=await fetchTrajet(urlTrajet('depart',today,hm(h),true)),[j,...autres]=d.trajets;
      el.innerHTML=j?`<p class="m" style="color:var(--mute);margin:8px 0 0">${nm<fin?`Fin des cours à ${esc(l[l.length-1].fin.replace(':','h'))}`:'Les cours sont finis'} · retour vers ${esc(t.de)}</p><div class="pars">Départ ${esc(j.depart.replace(':','h'))}</div>${ligneCompacte(j)}${autres.length?`<p class="m" style="color:var(--mute);font-size:13px;margin:10px 0 0">Sinon : ${autres.map(a=>esc(a.depart.replace(':','h'))).join(' · ')}</p>`:''}${alertesHtml(d)}`:`<p class="empty">Aucun trajet retour trouvé.</p>${alertesHtml(d)}`;
    }else{
      const retour=modeAuto()==='retour',d=await fetchTrajet(urlTrajet('depart',today,hm(nm),retour));
      el.innerHTML=`<p class="m" style="color:var(--mute);margin:8px 0 4px">Départs maintenant depuis ${esc(retour?t.vers:t.de)}</p>`+(listeDeparts(d.trajets)||'<p class="empty">Aucun départ trouvé.</p>')+alertesHtml(d);
    }
  }catch(e){el.innerHTML=`<p class="ko" style="margin:8px 0 0">Trajet indisponible : ${esc(e.message||e)}</p>`}
};

/* ---------- Emploi du temps façon Pronote ---------- */
const toMin=h=>{const [a,b]=String(h).split(':');return a*60+ +b};
const addD=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return isoDay(d)};
const mondayOf=iso=>addD(iso,-((new Date(iso+'T12:00').getDay()+6)%7));
const COLS=['#00e5a0','#3ad7ff','#ffc24a','#ff5c7a','#b18cff','#5b8cff','#ff8a3d','#36d1b7','#f06bd2','#9be15d'];
const colorOf=k=>{let h=0;for(const ch of String(k))h=(h*31+ch.charCodeAt(0))>>>0;return COLS[h%COLS.length]};
const T0=8*60,T1=18*60+30,K=1.15; // la grille va de 8h à 18h30, 1,15 px par minute
// Tous les cours d'une date : ceux de Formadep + ceux ajoutés à la main (répétés chaque semaine)
const coursDu=iso=>{
  const fm=Object.values(S.get('edtf',{})).flatMap(w=>w.cours||[]).filter(c=>c.date===iso);
  const dj=new Date(iso+'T12:00').getDay();
  const man=S.get('edt',[]).filter(c=>+c.jour===dj).map(c=>({...c,titre:c.module,code:c.module}));
  const l=[...fm,...man].sort((a,b)=>toMin(a.debut)-toMin(b.debut));
  // Si deux cours se chevauchent, on les met côte à côte (des "couloirs")
  let grp=[],end=0;const close=()=>{const n=Math.max(1,...grp.map(c=>c._l+1));grp.forEach(c=>c._n=n);grp=[]};
  for(const c of l){if(toMin(c.debut)>=end)close();const used=grp.filter(g=>toMin(g.fin)>toMin(c.debut)).map(g=>g._l);let k=0;while(used.includes(k))k++;c._l=k;grp.push(c);end=Math.max(end,toMin(c.fin))}
  close();return l;
};
let edtDay='',edtMode=(typeof innerWidth!=='undefined'&&innerWidth>=900)?'semaine':'jour';
const firstDay=()=>{let d=isoDay(new Date()),w=new Date(d+'T12:00').getDay();return w===6?addD(d,2):w===0?addD(d,1):d};
// Si la semaine affichée n'est pas encore chargée, on la demande au Worker
const ensureWeek=iso=>{const mon=mondayOf(iso),all=Object.values(S.get('edtf',{}));
  if(all.some(w=>w.lundi===mon))return;const sem=all.flatMap(w=>w.semaines||[]).find(s=>s.lundi===mon);
  if(sem&&!loading)loadEdt(sem.num)};
const timeline=(days,compact)=>{
  const hours=[];for(let h=8;h<=18;h++)hours.push(h);
  const now=new Date(),nIso=isoDay(now),nMin=now.getHours()*60+now.getMinutes(),H=(T1-T0)*K;
  const cols=`grid-template-columns:40px repeat(${days.length},minmax(0,1fr))`;
  return `${days.length>1?`<div class="tl tl-head" style="${cols}"><span></span>${days.map(d=>`<span class="${d===nIso?'ok':''}">${new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</span>`).join('')}</div>`:''}
  <div class="tl" style="${cols}"><div class="tl-h" style="height:${H}px">${hours.map(h=>`<span style="top:${(h*60-T0)*K}px">${h}h</span>`).join('')}</div>
  ${days.map(d=>{const cs=coursDu(d);return `<div class="tl-d" style="height:${H}px">${hours.map(h=>`<i style="top:${(h*60-T0)*K}px"></i>`).join('')}
   ${cs.map((c,ci)=>{const a=Math.max(T0,toMin(c.debut)),b=Math.min(T1,toMin(c.fin)),col=colorOf(c.code||c.titre),long=b-a>=75;
     return `<div class="blk" data-cday="${d}" data-ci="${ci}" style="top:${(a-T0)*K}px;height:${(b-a)*K-3}px;left:${c._l/c._n*100}%;width:calc(${100/c._n}% - 4px);--c:${col}">${c.type&&!compact?`<em>${esc(c.type)}</em>`:''}<b>${esc(compact?(c.code||c.titre):c.titre)}</b><small>${esc(c.debut)}–${esc(c.fin)}</small>${c.salle&&(long||!compact)?`<small>${esc(c.salle)}</small>`:''}${c.prof&&long&&!compact?`<small>${esc(c.prof)}</small>`:''}</div>`}).join('')}
   ${d===nIso&&nMin>T0&&nMin<T1?`<div class="now" style="top:${(nMin-T0)*K}px"></div>`:''}
   ${!cs.length&&!compact?'<p class="empty" style="position:absolute;top:40%;width:100%;text-align:center">Pas de cours 🎉</p>':''}</div>`}).join('')}</div>`;
};
V.edt=()=>{

  <div class="tabs edtbar" style="align-items:center"><button class="${edtMode==='jour'?'':'ghost'}" data-mode="jour">Jour</button><button class="${edtMode==='semaine'?'':'ghost'}" data-mode="semaine">Semaine</button><span style="flex:1"></span><button class="ghost" data-today>Aujourd'hui</button><button class="ghost" data-sync>${loading?'…':'↻'}</button></div>
  <div class="strip"><button class="ghost arr" data-shift="-7" aria-label="Semaine précédente">‹</button>
   ${week.map(d=>{const dt=new Date(d+'T12:00');return `<button class="dy ${d===edtDay&&edtMode==='jour'?'on':''} ${d===nIso?'today':''}" data-day="${d}">${dt.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}<b>${dt.getDate()}</b>${coursDu(d).length?'<i></i>':''}</button>`}).join('')}
   <button class="ghost arr" data-shift="7" aria-label="Semaine suivante">›</button></div>
  <div class="card tl-card" id="tlcard">${edtMode==='jour'?`<h2 style="margin:0 0 12px">${new Date(edtDay+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h2>`+timeline([edtDay],false):timeline(week,innerWidth<700)}
   ${!wk&&!loading?'<p class="m" style="color:var(--mute);font-size:13px;margin:10px 0 0">Semaine pas encore chargée depuis Formadep (ou vacances).</p>':''}</div>
  <p class="m" style="color:var(--mute);font-size:13px;margin:10px 0 18px">${edtMode==='jour'?'Glisse à gauche ou à droite pour changer de jour. ':''}${last?'Formadep mis à jour '+new Date(last).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):''}</p>
  <details class="card"><summary style="cursor:pointer;font-family:var(--mono);font-weight:700">Cours ajoutés à la main</summary><div style="margin-top:14px"><form class="f" data-f="edt">
   <select name="jour">${[1,2,3,4,5,6].map(j=>`<option value="${j}">${JOURS[j]}</option>`).join('')}</select>
   <input name="debut" type="time" value="08:30" required><input name="fin" type="time" value="10:00" required>
   <input name="module" placeholder="Module (ex : R106)" required><input name="salle" placeholder="Salle">
   <select name="type"><option>CM</option><option>TD</option><option>TP</option><option>SAÉ</option></select>
   <button>Ajouter</button></form>
  ${edt.map(c=>`<div class="row"><span class="time">${JOURS[c.jour].slice(0,3)} ${esc(c.debut)}</span><span class="t">${esc(c.module)}<div class="m">${esc(c.salle)}</div></span><span class="tag cy">${esc(c.type)}</span><button class="x" data-del="edt" data-id="${esc(c.id)}" aria-label="Supprimer">×</button></div>`).join('')||'<p class="empty">Aucun cours ajouté à la main.</p>'}</div></details>`;

  <div class="grid">${Object.entries(UES).map(([u,l])=>{const r=ueAvg(u),m=r.m,tot=MODS.reduce((a,x)=>a+(x[3][u]||0),0);
   return `<div class="card"><h2>${l}</h2><div class="big ${m!==null&&m<10?'ko':''}" style="font-size:40px">${fx(m)}<small> /20</small></div><div class="bar"><i style="width:${m===null?0:m*5}%;background:${m!==null&&m<10?'var(--bad)':'var(--acc)'}"></i></div>
   <p class="m" style="color:var(--mute);font-size:13px;margin:8px 0 6px">Basée sur ${r.c} / ${tot} de coefficients</p>
   ${MODS.filter(x=>x[3][u]).sort((a,b)=>b[3][u]-a[3][u]).map(([c,k,lab,co])=>{const a=modAvg(c);return `<div class="row" style="padding:7px 0"><span class="t" style="font-size:14px">${k} <span style="color:var(--mute)">${esc(lab)}</span></span><span class="tag cy">×${co[u]}</span><b style="font-family:var(--mono);min-width:44px;text-align:right" class="${a===null?'':a>=10?'ok':'ko'}">${a===null?'—':fx(a)}</b></div>`}).join('')}</div>`}).join('')}</div>

/* ---------- Absences ---------- */
const absStats=()=>{const l=S.get('abs',[]),A=l.filter(a=>a.type==='Absence');
  return {l,heures:A.reduce((s,a)=>s+ +a.duree,0),nj:A.filter(a=>!a.justif).reduce((s,a)=>s+ +a.duree,0),ret:l.filter(a=>a.type==='Retard').length}};
const fh=n=>(Math.round(n*10)/10).toString().replace('.',',')+' h';
const absView=()=>{
  const {l,heures,nj,ret}=absStats(),seuil=+S.get('absSeuil',0);
  const mods=[...new Set(l.map(a=>a.module))].map(m=>({m,h:l.filter(a=>a.module===m&&a.type==='Absence').reduce((s,a)=>s+ +a.duree,0),r:l.filter(a=>a.module===m&&a.type==='Retard').length})).sort((a,b)=>b.h-a.h);
  const maxH=Math.max(1,...mods.map(x=>x.h));
  return `${seuil&&nj>=seuil?`<div class="card" style="border-color:var(--bad);margin-bottom:16px"><b class="ko">⚠ Seuil atteint :</b> ${fh(nj)} d'absences non justifiées (ton seuil : ${fh(seuil)}). Pense à envoyer tes justificatifs.</div>`:''}
  <div class="grid" style="margin-bottom:16px">
   <div class="card"><h2>Non justifiées</h2><div class="big ${nj?'ko':''}">${fh(nj).replace(' h','')}<small> h</small></div></div>
   <div class="card"><h2>Total absences</h2><div class="big" style="color:var(--cy)">${fh(heures).replace(' h','')}<small> h</small></div><p class="m" style="color:var(--mute);margin:8px 0 0">${ret} retard${ret>1?'s':''}</p></div>
  </div>
  <div class="card" style="margin-bottom:16px"><h2>Signaler</h2><form class="f" data-f="abs">
   <input name="date" type="date" value="${isoDay(new Date())}" required><input name="module" placeholder="Module (ex : R107)" required>
   <select name="type"><option>Absence</option><option>Retard</option></select>
   <input name="duree" type="number" step="0.25" min="0" value="1.5" placeholder="Durée (h)" required>
   <label style="display:flex;align-items:center;gap:10px;min-height:44px"><input type="checkbox" name="justif"> Justifiée</label>
   <button>Ajouter</button></form>
   ${l.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="row"><span class="t">${esc(a.module)}<div class="m">${fmtD(a.date)} · ${esc(a.type)} · ${fh(+a.duree)}</div></span><button class="ghost" data-just="${esc(a.id)}" style="min-height:36px;padding:0 10px;font-size:14px;color:${a.justif?'var(--acc)':'var(--bad)'}">${a.justif?'Justifiée':'Non justifiée'}</button><button class="x" data-del="abs" data-id="${esc(a.id)}" aria-label="Supprimer">×</button></div>`).join('')||'<p class="empty">Aucune absence. Parfait 👌</p>'}</div>
  <div class="grid"><div class="card"><h2>Par module</h2>${mods.map(x=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${esc(x.m)}</span><b style="font-family:var(--mono)">${fh(x.h)}${x.r?` · ${x.r} ret.`:''}</b></div><div class="bar"><i style="width:${x.h/maxH*100}%;background:var(--cy)"></i></div></div>`).join('')||'<p class="empty">Rien à afficher.</p>'}</div>
  <div class="card"><h2>Seuil d'alerte</h2><p class="m" style="color:var(--mute);margin:0 0 12px">Mets ici la limite d'heures non justifiées indiquée dans ton règlement des études. L'app t'alertera quand tu l'atteins.</p><form class="f" data-f="seuil" style="grid-template-columns:1fr auto"><input name="s" type="number" step="0.5" min="0" value="${seuil||''}" placeholder="ex : 10"><button>Enregistrer</button></form></div></div>`;

/* ---------- Flashcards : répétition espacée (boîtes de Leitner) ---------- */
let revTab='pdf',fcMod='',fcBack=false,fcAll=false;
const BOX_DAYS=[0,1,2,4,8,16]; // boîte 1 → revoir demain, boîte 5 → dans 16 jours
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDay(d)};
const fcDeck=()=>{const t=isoDay(new Date());return S.get('cards',[]).filter(c=>(!fcMod||c.module===fcMod)&&(fcAll||(c.due||'')<=t)).sort((a,b)=>fcAll?(a.last||0)-(b.last||0):(a.due||'').localeCompare(b.due||'')||(a.last||0)-(b.last||0))};
const dueCount=()=>{const t=isoDay(new Date());return S.get('cards',[]).filter(c=>(c.due||'')<=t).length};
V.revisions=()=>{
  const cards=S.get('cards',[]),mods=[...new Set(cards.map(c=>c.module))];
  const deck=fcDeck(),cur=deck[0],mast=cards.filter(c=>(c.box||1)>=5).length;
  const next=cards.filter(c=>!fcMod||c.module===fcMod).map(c=>c.due||'').sort()[0];
  const dots=b=>`<span style="font-family:var(--mono);color:var(--acc);letter-spacing:2px" title="Niveau ${b}/5">${'●'.repeat(b)}<span style="color:var(--line)">${'●'.repeat(5-b)}</span></span>`;
  return `<h1><b>Révisions</b></h1><p class="sub">Tes guides et tes flashcards</p>
  <div class="tabs"><button class="${revTab==='pdf'?'':'ghost'}" data-rt="pdf">Guides PDF</button><button class="${revTab==='fc'?'':'ghost'}" data-rt="fc">Flashcards${dueCount()?` (${dueCount()})`:''}</button></div>
  ${revTab==='pdf'?`<div class="card"><form class="f" data-f="pdf"><input name="module" placeholder="Module (ex : R106)" required><input name="file" type="file" accept="application/pdf" required><button>Déposer</button></form><div id="pdflist"><p class="empty">Chargement…</p></div></div>`
  :`<div class="grid"><div class="card"><h2>${fcAll?'Révision libre':'À réviser aujourd\'hui'}</h2>
   <div style="display:flex;gap:8px;margin-bottom:12px"><select data-fm><option value="">Tous les modules</option>${mods.map(m=>`<option ${m===fcMod?'selected':''}>${esc(m)}</option>`).join('')}</select>${fcAll?'<button class="ghost" data-fcall>Mode normal</button>':''}</div>
   ${cur?`<p class="m" style="color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between"><span>${esc(cur.module)} · reste ${deck.length}</span>${dots(cur.box||1)}</p>
    <div class="flash ${fcBack?'back':''}" data-flip>${esc(fcBack?cur.r:cur.q)}</div>
    ${fcBack?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button data-grade="0" style="background:var(--bad)">Raté</button><button data-grade="1" style="background:var(--warn)">Moyen</button><button data-grade="2">Facile</button></div>`
    :'<p class="m" style="color:var(--mute);text-align:center;margin:0">Réfléchis, puis touche la carte pour voir la réponse</p>'}`
   :`<div class="flash" style="cursor:default">Rien à réviser aujourd'hui 🎉${next?`<br><small style="color:var(--mute);font-size:14px">Prochaine carte : ${fmtD(next)}</small>`:''}</div>${cards.length?'<button class="ghost" data-fcall style="width:100%">Réviser quand même</button>':''}`}
   <p class="m" style="color:var(--mute);font-size:13px;margin:14px 0 0">${cards.length} carte${cards.length>1?'s':''} · ${mast} maîtrisée${mast>1?'s':''}. Raté → la carte revient tout de suite. Facile → elle monte d'un niveau et revient plus tard (1, 2, 4, 8 puis 16 jours).</p></div>
   <div class="card"><h2>Nouvelle carte</h2><form class="f" data-f="cards" style="grid-template-columns:1fr"><input name="module" placeholder="Module" value="${esc(fcMod)}" required><textarea name="q" rows="2" placeholder="Question" required></textarea><textarea name="r" rows="2" placeholder="Réponse" required></textarea><button>Ajouter la carte</button></form>
   ${cards.slice(-6).reverse().map(c=>`<div class="row"><span class="t">${esc(c.q)}<div class="m">${esc(c.module)}</div></span>${dots(c.box||1)}<button class="x" data-del="cards" data-id="${esc(c.id)}" aria-label="Supprimer">×</button></div>`).join('')}</div></div>`}`;
};
const gradeCard=g=>{
  const cur=fcDeck()[0];if(!cur)return;
  S.set('cards',S.get('cards',[]).map(c=>{if(c.id!==cur.id)return c;
    const box=g===0?1:g===1?(c.box||1):Math.min(5,(c.box||1)+1);
    return {...c,box,due:g===0?isoDay(new Date()):addDays(BOX_DAYS[box]),last:Date.now()}}));
  fcBack=false;render();
};

   vlsm:()=>`<div class="card"><h2>Découpage VLSM</h2><p class="m" style="color:var(--mute);margin:0 0 12px">Un sous-réseau par ligne : nom puis nombre d'hôtes. L'app range du plus gros au plus petit, comme en TD.</p>

LAN Profs 25

   masques:()=>`<div class="card"><h2>Masques de sous-réseau</h2><div class="scroll"><table class="tbl"><thead><tr><th>CIDR</th><th>Masque</th><th>Wildcard</th><th class="r">Adresses</th><th class="r">Hôtes</th></tr></thead><tbody>${Array.from({length:25},(_,i)=>i+8).map(c=>{const n=2**(32-c),m=2**32-n;return `<tr><td class="ok">/${c}</td><td>${intToIp(m)}</td><td>${intToIp(n-1)}</td><td class="r">${n.toLocaleString('fr-FR')}</td><td class="r">${(c>=31?(c===32?1:2):n-2).toLocaleString('fr-FR')}</td></tr>`}).join('')}</tbody></table></div>

  };

const render=()=>{
  let k=location.hash.slice(1);
  if(SOUS_ETUDES[k]){etudesTab=k;k='etudes'}              // #devoirs → Études / Devoirs
  if(!V[k])k='accueil';
  $('#view').innerHTML=V[k]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  const sub=k==='etudes'?etudesTab:k;
  if(sub==='revisions'&&revTab==='pdf')listPdf();
  if(k==='edt')ensureWeek(edtDay||firstDay());
  if(k==='accueil')loadTrajet();
  if(sub==='reseau'){if(netTab==='ip'){calcIp('192.168.1.10/24');conv('200',10)}if(netTab==='vlsm')calcVlsm($('[name=base]').value,$('[name=list]').value);if(netTab==='ipv6')calcV6($('[name=a]').value)}

/* Glisser le doigt pour changer de jour (comme sur Pronote) */
{let sx=0,sy=0;
 document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
 document.addEventListener('touchend',e=>{if(location.hash!=='#edt'||edtMode!=='jour'||!e.target.closest('#tlcard'))return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<60||Math.abs(dy)>50)return;
  let d=addD(edtDay,dx<0?1:-1);while([0,6].includes(new Date(d+'T12:00').getDay()))d=addD(d,dx<0?1:-1);edtDay=d;render()},{passive:true});}

/* ---------- Outils réseau ---------- */
const ipToInt=s=>{const p=s.split('.');if(p.length!==4||p.some(x=>!/^\d+$/.test(x)||+x>255))return null;return p.reduce((a,x)=>a*256+ +x,0)};
const intToIp=n=>[24,16,8,0].map(s=>Math.floor(n/2**s)%256).join('.');
const bin=n=>[24,16,8,0].map(s=>(Math.floor(n/2**s)%256).toString(2).padStart(8,'0')).join('.');
const calcIp=v=>{
  const out=$('#ipres');const [a,c]=v.trim().split('/');const ip=ipToInt(a||''),cidr=+c;
  if(ip===null||!/^\d+$/.test(c||'')||cidr>32){out.innerHTML='<p class="ko">Format attendu : 192.168.1.10/24</p>';return}
  const size=2**(32-cidr),net=Math.floor(ip/size)*size,bc=net+size-1,mask=2**32-size;
  const hosts=cidr>=31?(cidr===32?1:2):size-2;
  const cls=+a.split('.')[0]<128?'A':+a.split('.')[0]<192?'B':+a.split('.')[0]<224?'C':'D/E';
  out.innerHTML=`<dl class="res"><dt>Masque</dt><dd>${intToIp(mask)}</dd><dt>Réseau</dt><dd class="ok">${intToIp(net)}/${cidr}</dd><dt>Broadcast</dt><dd>${intToIp(bc)}</dd><dt>1re hôte</dt><dd>${cidr>=31?intToIp(net):intToIp(net+1)}</dd><dt>Dernière</dt><dd>${cidr>=31?intToIp(bc):intToIp(bc-1)}</dd><dt>Nb hôtes</dt><dd>${hosts.toLocaleString('fr-FR')}</dd><dt>Classe</dt><dd>${cls}</dd><dt>IP bin</dt><dd>${bin(ip)}</dd><dt>Masque bin</dt><dd>${bin(mask)}</dd></dl>`;
};
const conv=(v,b)=>{
  const out=$('#convres');const ok={2:/^[01]+$/,10:/^\d+$/,16:/^[0-9a-f]+$/i}[b].test(v.trim());const n=ok?parseInt(v.trim(),b):NaN;
  out.innerHTML=isNaN(n)?'<p class="ko">Valeur invalide pour cette base</p>':`<dl class="res"><dt>Décimal</dt><dd>${n}</dd><dt>Binaire</dt><dd class="ok">${n.toString(2).replace(/\B(?=(\d{4})+$)/g,' ')}</dd><dt>Hexa</dt><dd>0x${n.toString(16).toUpperCase()}</dd></dl>`;
};

/* ---------- VLSM ---------- */
const calcVlsm=(base,txt)=>{
  const out=$('#vlsmres');const [a,c]=base.trim().split('/');const ip=ipToInt(a||''),cidr=+c;
  if(ip===null||!/^\d+$/.test(c||'')||cidr>30){out.innerHTML='<p class="ko">Réseau de départ attendu : 192.168.10.0/24</p>';return}
  const size=2**(32-cidr),net=Math.floor(ip/size)*size,end=net+size;
  const needs=txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s:;,=]+(\d+)$/);return m?{nom:m[1].trim()||'Sous-réseau',h:+m[2]}:null});
  if(!needs.length||needs.some(n=>!n||n.h<1)){out.innerHTML='<p class="ko">Chaque ligne doit finir par un nombre d\'hôtes, ex : LAN Admin 50</p>';return}
  needs.sort((x,y)=>y.h-x.h);
  let cur=net,ok=true;
  const rows=needs.map(n=>{const blk=Math.max(4,2**Math.ceil(Math.log2(n.h+2))),p=32-Math.log2(blk);cur=Math.ceil(cur/blk)*blk;const r={...n,blk,p,net:cur,fit:cur+blk<=end};if(!r.fit)ok=false;cur+=blk;return r});
  const used=Math.min(cur,end)-net;
  out.innerHTML=`<p class="${ok?'ok':'ko'}" style="margin:14px 0 8px">${ok?`✓ Tout rentre : ${used} adresses utilisées sur ${size} (${Math.round(used/size*100)} %)`:'✗ Ça ne rentre pas dans ce réseau : prends un préfixe plus grand.'}</p>
  <div class="scroll"><table class="tbl"><thead><tr><th>Nom</th><th class="r">Demandés</th><th class="r">Dispo</th><th>Réseau</th><th>Masque</th><th>1re → dernière</th><th>Broadcast</th></tr></thead><tbody>${rows.map(r=>`<tr${r.fit?'':' class="ko"'}><td><b>${esc(r.nom)}</b></td><td class="r">${r.h}</td><td class="r">${r.blk-2}</td><td class="ok">${intToIp(r.net)}/${r.p}</td><td>${intToIp(2**32-r.blk)}</td><td>${intToIp(r.net+1)} → ${intToIp(r.net+r.blk-2)}</td><td>${intToIp(r.net+r.blk-1)}</td></tr>`).join('')}</tbody></table></div>`;
};

/* ---------- IPv6 ---------- */
const v6parse=s=>{
  s=s.trim().toLowerCase();let pfx=null;
  if(s.includes('/')){const [x,p]=s.split('/');s=x;if(!/^\d+$/.test(p)||+p>128)return null;pfx=+p}
  if(!/^[0-9a-f:]+$/.test(s))return null;const dbl=s.split('::');if(dbl.length>2)return null;
  const L=dbl[0]?dbl[0].split(':'):[],R=dbl.length===2&&dbl[1]?dbl[1].split(':'):[];
  if(dbl.length===1&&L.length!==8)return null;if(dbl.length===2&&L.length+R.length>7)return null;
  const g=[...L,...Array(8-L.length-R.length).fill('0'),...R];if(g.some(x=>!/^[0-9a-f]{1,4}$/.test(x)))return null;
  return {g:g.map(x=>parseInt(x,16)),pfx};
};
const v6str=g=>{ // forme compressée (RFC 5952)
  let best=-1,len=0;for(let i=0;i<8;){if(g[i]===0){let j=i;while(j<8&&g[j]===0)j++;if(j-i>len&&j-i>=2){best=i;len=j-i}i=j}else i++}
  const h=g.map(x=>x.toString(16));if(best<0)return h.join(':');
  return h.slice(0,best).join(':')+'::'+h.slice(best+len).join(':');
};
const v6type=g=>{const a=g[0];
  if(g.every(x=>x===0))return 'Non spécifiée (::) — « pas encore d\'adresse »';
  if(g.slice(0,7).every(x=>x===0)&&g[7]===1)return 'Boucle locale (::1) — équivalent de 127.0.0.1';
  if(g.slice(0,5).every(x=>x===0)&&g[5]===0xffff)return 'IPv4 mappée (::ffff:0:0/96)';
  if(a===0x2001&&g[1]===0xdb8)return 'Documentation (2001:db8::/32) — réservée aux exemples';
  if((a&0xffc0)===0xfe80)return 'Lien-local (fe80::/10) — ne sort jamais du réseau local';
  if((a&0xfe00)===0xfc00)return 'Unique locale (fc00::/7) — équivalent des adresses privées';
  if((a&0xff00)===0xff00)return 'Multicast (ff00::/8) — envoi à un groupe';
  if((a&0xe000)===0x2000)return 'Globale unicast (2000::/3) — routable sur Internet';
  return 'Autre / réservée'};
const calcV6=s=>{const out=$('#v6res'),r=v6parse(s);
  if(!r){out.innerHTML='<p class="ko">Adresse IPv6 invalide (8 groupes de 4 chiffres hexa max, un seul ::)</p>';return}
  const full=r.g.map(x=>x.toString(16).padStart(4,'0')).join(':');
  let net='';if(r.pfx!==null){const n=r.g.map((x,i)=>{const bits=Math.max(0,Math.min(16,r.pfx-i*16));return bits===0?0:x&(0xffff<<(16-bits)&0xffff)});net=v6str(n)+'/'+r.pfx}
  out.innerHTML=`<dl class="res"><dt>Complète</dt><dd>${full}</dd><dt>Compressée</dt><dd class="ok">${v6str(r.g)}${r.pfx!==null?'/'+r.pfx:''}</dd><dt>Type</dt><dd>${esc(v6type(r.g))}</dd>${net?`<dt>Préfixe</dt><dd>${net}</dd><dt>Partie hôte</dt><dd>${128-r.pfx} bits</dd>`:''}</dl>`;
};

const listPdf=async()=>{
  let l;try{l=await tx('readonly',s=>s.getAll())}catch(e){l=memPdf}
  // Les PDF déposés avant la synchro n'ont pas de fiche : on la crée
  const meta=S.get('pdfmeta',[]);let add=l.filter(p=>!meta.some(m=>m.id===p.id)).map(p=>({id:p.id,module:p.module,name:p.name,size:p.size,cloud:false}));
  if(add.length){S.set('pdfmeta',[...meta,...add]);if(sbUser)uploadPendingPdfs()}
  const all=S.get('pdfmeta',[]),here=new Set(l.map(p=>p.id));
  const el=$('#pdflist');if(!el)return;

addEventListener('online',()=>{netState();toast('De retour en ligne ✓');syncNow();loadEdt()});
netState();

if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').then(checkPush).catch(()=>{});
}

{const cur=S.get('edtf',{})[S.get('edtCur','')];if(S.get('apiUrl',API0)&&(!cur||Date.now()-new Date(cur.maj)>6*36e5))loadEdt()}
}
